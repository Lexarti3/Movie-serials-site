name: Generate SEO Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate pages
        run: |
          node generate.js
          node sitemap.js

      - name: Commit site
        run: |
          git config user.name "seo-bot"
          git config user.email "bot@github.com"
          git add site
          git commit -m "auto generate seo" || echo "no changes"
          git push




