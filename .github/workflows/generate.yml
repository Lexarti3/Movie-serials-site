name: Generate SEO Pages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install node-fetch

      - name: Generate pages
        run: |
          cd generator
          node generate.js
          node sitemap.js

      - name: Commit site
        run: |
          git config --global user.name "seo-bot"
          git config --global user.email "bot@github.com"
          git add site
          git commit -m "auto generate seo" || echo "no changes"
          git push
